[package]
name = "micropanel-lightroom"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license = "CC0-1.0"

[dependencies]
micropanel = { path = "../../helper" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading"] }
