[package]
name = "micropanel"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license = "CC0-1.0"
description = "Use the DaVinci Resolve Micro Color Panel in other applications"

[features]
# build the fallback for other systems on Windows too (src/sys)
portable = []

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tiny_http = "0.12.0"
toml = "1.2.1"
toml_edit = "0.25.19"
tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
hidapi = "2.6.7"

# hidraw without the C libraries (libudev, libusb)
[target.'cfg(target_os = "linux")'.dependencies]
hidapi = { version = "2.6.7", default-features = false, features = ["linux-native-basic-udev"] }

[target.'cfg(windows)'.dependencies]
tray-icon = "0.26.1"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_System_Registry", "Win32_System_Diagnostics_ToolHelp", "Win32_Security", "Win32_System_Console", "Win32_Media_Audio", "Win32_Media_Multimedia", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Graphics_GdiPlus", "Win32_UI_HiDpi", "Win32_System_LibraryLoader", "Win32_System_SystemInformation"] }
